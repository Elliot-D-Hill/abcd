random_seed = 42

[index]
sample_id = "src_subject_id"
event = "eventname"
previous_label = "y_t"
label = "y_{t+1}"
split = "split"

[preprocess]
# Events whose rows are model inputs. Each row is labelled by the subject's next
# observed event, so 3-year rows would be labelled by the partial 4-year release.
feature_events = [0, 1, 2]
[preprocess.splits]
train = 0.8
val = 0.1
test = 0.1

[columns]
# CBCL syndrome scales: the p-factor outcome is extracted from these, so they are
# never features.
cbcl = [
    "cbcl_scr_syn_anxdep_t",
    "cbcl_scr_syn_withdep_t",
    "cbcl_scr_syn_somatic_t",
    "cbcl_scr_syn_social_t",
    "cbcl_scr_syn_thought_t",
    "cbcl_scr_syn_attention_t",
    "cbcl_scr_syn_rulebreak_t",
    "cbcl_scr_syn_aggressive_t",
]
# Imaging columns present in data/dataset.csv; excluded from the questions-only
# dataset.
mri = [
    "dmdtifp1_10",
    "dmdtifp1_9",
    "dmdtifp1_19",
    "dmdtifp1_4",
    "dmdtifp1_3",
    "dmdtifp1_6",
    "dmdtifp1_5",
    "dmdtifp1_8",
    "dmdtifp1_7",
    "dmdtifp1_17",
    "dmdtifp1_18",
    "dmdtifp1_1",
    "dmdtifp1_14",
    "dmdtifp1_13",
    "dmdtifp1_27",
    "dmdtifp1_26",
    "dmdtifp1_12",
    "dmdtifp1_11",
    "dmdtifp1_2",
    "dmdtifp1_21",
    "dmdtifp1_20",
    "rsfmri_c_ngd_cgc_ngd_dt",
    "rsfmri_c_ngd_dt_ngd_fo",
    "rsfmri_c_ngd_dt_ngd_dt",
    "rsfmri_c_ngd_fo_ngd_cgc",
    "rsfmri_c_ngd_fo_ngd_fo",
    "rsfmri_c_ngd_cgc_ngd_cgc",
    "tfmri_sacsvcg_bcdk_bktslh",
    "tfmri_sacsvcg_bcdk_bktsrh",
    "tfmri_ma_alrvn_b_cds_bkslh",
    "tfmri_ma_alrvn_b_cds_bksrh",
    "tfmri_nback_all_339",
    "tfmri_nback_all_373",
]
# Non-feature demographics, screentime summary scores (redundant with the item
# responses), and sex dummies redundant with demo_sex_v2_1 (male indicator).
excluded = [
    "race_ethnicity",
    "interview_date",
    "stq_y_ss_weekday",
    "stq_y_ss_weekend",
    "demo_sex_v2_2",
    "demo_sex_v2_3",
]

[dataloader]
batch_size = 512
num_workers = 0
ignore_index = -100

# Trainer, optimizer, scheduler, and model values are the LSTM hyperparameters
# selected by the tuning study in Hill et al. (2025). The earlier placeholders
# (lr 1e-3, 50 epochs, hidden 64, 2 layers) left the model at chance-level loss.
[trainer]
accelerator = "cpu"
precision = "32-true"
max_epochs = 56
gradient_clip_val = 1.0
enable_progress_bar = false
enable_model_summary = false

[optimizer]
lr = 3e-3
momentum = 0.9
nesterov = true
weight_decay = 1.61e-6

[scheduler]
# Multiply the learning rate by `factor` after `patience` epochs without a lower
# validation loss.
factor = 0.1
patience = 2

[model]
hidden_dim = 191
num_layers = 1
# The paper's tuned dropout (0.182) is inert for a single-layer LSTM, which only
# applies dropout between layers.
dropout = 0.0
output_dim = 4

[filepaths]
dataset = "data/dataset.csv"
train = "data/analytic/train.parquet"
val = "data/analytic/val.parquet"
test = "data/analytic/test.parquet"
checkpoints = "data/results/checkpoints"
predictions = "data/results/predictions.parquet"
